<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Car body gradient -->
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Car body -->
  <path d="M12 38 L16 28 L20 24 L44 24 L48 28 L52 38 L52 44 L50 46 L48 46 L46 44 L18 44 L16 46 L14 46 L12 44 Z" 
        fill="url(#carGradient)" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Car roof -->
  <path d="M20 24 L24 18 L40 18 L44 24 Z" 
        fill="url(#carGradient)" stroke="#1e3a8a" stroke-width="1.5"/>
  
  <!-- Windows -->
  <path d="M22 23 L25 19 L32 19 L32 23 Z" 
        fill="#60a5fa" opacity="0.7"/>
  <path d="M33 23 L33 19 L39 19 L42 23 Z" 
        fill="#60a5fa" opacity="0.7"/>
  
  <!-- Wheels -->
  <circle cx="20" cy="44" r="5" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <circle cx="20" cy="44" r="2.5" fill="#6b7280"/>
  
  <circle cx="44" cy="44" r="5" fill="#1f2937" stroke="#374151" stroke-width="1.5"/>
  <circle cx="44" cy="44" r="2.5" fill="#6b7280"/>
  
  <!-- Headlight -->
  <circle cx="50" cy="32" r="2" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Door handle -->
  <rect x="30" y="32" width="4" height="1.5" rx="0.5" fill="#1e3a8a"/>
</svg>
